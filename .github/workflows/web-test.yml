name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sdk/**"
      - ".github/workflows/web-test.yml"
  pull_request:
    paths:
      - "web/**"
      - "sdk/**"

jobs:
  build:
    name: Type check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app imports the SDK's built output.
      - name: Build SDK
        run: pnpm --filter auctionflow-sdk build

      - name: Type check
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Docker image
        run: docker build -f web/Dockerfile -t auctionflow-web .
