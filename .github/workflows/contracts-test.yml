name: Contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-test.yml"
  pull_request:
    paths:
      - "contracts/**"

jobs:
  test:
    name: Forge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Caches ~/.foundry/cache, including RPC responses. The fork tests pin a
      # block, so after the first run almost every read comes from the cache.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # The fork tests in test/fork run against real Uniswap v3 on a Base
      # mainnet fork. They skip when BASE_RPC_URL is empty, which is the case
      # when the secret isn't set and on pull requests from forks, which never
      # receive secrets.
      # The test runner doesn't enforce the EIP-170 contract size limit, so a
      # contract can pass every test and still be undeployable. This step
      # fails if any production contract is over the limit.
      - name: Check contract sizes
        working-directory: contracts
        run: forge build --sizes --skip test --skip script

      - name: Run tests
        working-directory: contracts
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv

      - name: Check gas snapshots
        working-directory: contracts
        run: forge snapshot --check
        continue-on-error: true
