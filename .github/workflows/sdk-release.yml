name: Release SDK

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # sdk-v3.0.1 and sdk-v3.1.0 were both first pushed on the commit before
      # their release commit. That builds the previous version, already on
      # npm, so every step below passed without publishing anything.
      - name: Check the tag matches the SDK version
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          if [ "$GITHUB_REF_NAME" != "sdk-v$version" ]; then
            echo "::error::$GITHUB_REF_NAME is on a commit where the SDK is $version; tag the release commit"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter auctionflow-sdk build

      - name: Run tests
        run: pnpm --filter auctionflow-sdk test

      # From the package's own directory, not with --filter: --filter runs
      # pnpm's recursive publish, which has exited 0 without publishing
      # (sdk-v3.0.0's and sdk-v3.1.0's first runs).
      - name: Publish to npm
        working-directory: sdk
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Confirm the version actually reached the registry anyway.
      - name: Confirm the version is on npm
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          for attempt in $(seq 1 12); do
            if npm view "auctionflow-sdk@$version" version >/dev/null 2>&1; then
              echo "auctionflow-sdk@$version is on npm"
              exit 0
            fi
            sleep 10
          done
          echo "::error::auctionflow-sdk@$version is not on npm after publishing"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
