name: Release SDK

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter auctionflow-sdk build

      - name: Run tests
        run: pnpm --filter auctionflow-sdk test

      - name: Publish to npm
        run: pnpm --filter auctionflow-sdk publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The publish step has exited 0 without publishing (sdk-v3.0.0's first
      # run), so confirm the version actually reached the registry.
      - name: Confirm the version is on npm
        run: |
          version=$(node -p "require('./sdk/package.json').version")
          for attempt in $(seq 1 12); do
            if npm view "auctionflow-sdk@$version" version >/dev/null 2>&1; then
              echo "auctionflow-sdk@$version is on npm"
              exit 0
            fi
            sleep 10
          done
          echo "::error::auctionflow-sdk@$version is not on npm after publishing"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
